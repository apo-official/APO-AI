<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>APO AI</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f1115;--panel:#151922;--panel2:#1b202b;--border:#2a303d;--text:#f3f5f7;--muted:#9aa3b2;--accent:#fff;--accentText:#111318;--user:#262c38}
body.light{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--border:#dfe3e8;--text:#181b20;--muted:#68707d;--accent:#111318;--accentText:#fff;--user:#eceff3}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{height:100vh;position:sticky;top:0;background:var(--panel);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--text);font-weight:700}
.logo{width:40px;height:40px;border-radius:11px;overflow:hidden;background:#000;border:1px solid var(--border)}
.logo img,.hero-logo img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.newchat,.sidebtn,.ghost,.primary,.suggest,.google,.mode-lock{border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text)}
.newchat{padding:11px;width:100%;font-weight:600}
.chats{flex:1;overflow:auto}.label{color:var(--muted);font-size:12px;text-transform:uppercase;padding:6px}
.chatitem{width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:10px;border-radius:8px}
.chatitem.active,.chatitem:hover{background:var(--panel2)}
.sidebottom{display:grid;gap:6px}.sidebtn{background:transparent;text-align:left;padding:10px;border-color:transparent}
.main{min-width:0;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.modewrap{display:flex;align-items:center;gap:8px}.modewrap label,.hint{color:var(--muted);font-size:12px}
select,input,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px}
select{padding:8px 10px}select:disabled{opacity:.5;cursor:not-allowed}
.mode-lock{padding:6px 9px;background:transparent;color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px}.ghost,.primary{padding:8px 13px}.ghost{background:transparent}.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:600}
.chatview{overflow:auto;padding:24px 20px 170px}
.hero{max-width:850px;margin:11vh auto 0;text-align:center}.hero-logo{width:88px;height:88px;border-radius:22px;overflow:hidden;margin:0 auto 18px;border:1px solid var(--border);background:#000}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0}.hero p{color:var(--muted)}
.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}.suggest{text-align:left;padding:15px;min-height:105px}.suggest span{display:block;color:var(--muted);font-size:13px;margin-top:7px}
.messages{max-width:860px;margin:auto;display:grid;gap:26px}.message{display:flex;gap:12px}.message.user{justify-content:flex-end}.bubble{max-width:min(82%,740px);white-space:pre-wrap;line-height:1.6}.user .bubble{background:var(--user);padding:12px 15px;border-radius:16px 16px 4px 16px}
.avatar{width:32px;height:32px;border-radius:9px;overflow:hidden;background:#000;border:1px solid var(--border);flex:0 0 auto}
.composerwrap{position:fixed;left:270px;right:0;bottom:0;padding:18px 20px 12px;background:linear-gradient(to top,var(--bg) 70%,transparent)}.composer{max-width:860px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.28)}textarea{width:100%;min-height:48px;max-height:180px;resize:none;background:transparent;border:0;outline:0;padding:10px}
.composerrow{display:flex;align-items:center;justify-content:space-between}.send{width:36px;height:36px;border:0;border-radius:10px;background:var(--accent);color:var(--accentText);font-weight:800}
.note{max-width:860px;margin:8px auto 0;text-align:center;color:var(--muted);font-size:11px}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:18px}.hidden{display:none!important}.modal{width:min(100%,420px);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;position:relative}.close{position:absolute;right:14px;top:10px;border:0;background:none;color:var(--muted);font-size:25px}
.google{width:100%;padding:11px;margin-top:10px}.divider{text-align:center;color:var(--muted);margin:14px 0}#authForm{display:grid;gap:10px}#authForm input{padding:11px}.full{width:100%}.switch{width:100%;border:0;background:none;color:var(--muted);padding:12px}
.mobile{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;width:min(82vw,290px);transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.composerwrap{left:0}.mobile{display:block}.suggestions{grid-template-columns:1fr}.actions .ghost{display:none}.mode-lock{display:none}}
</style>
</head>

function add(role,content){
 let c=chats.find(x=>x.id===activeChatId);if(!c){c={id:id(),title:content.slice(0,36)||"New chat",messages:[],mode:$("modeSelect").value};chats.unshift(c);activeChatId=c.id}
 c.messages.push({role,content});c.mode=$("modeSelect").value;save();render();
}
function send(){
 const t=$("messageInput").value.trim();if(!t)return;add("user",t);$("messageInput").value="";
 setTimeout(()=>add("assistant",`APO AI backend is not connected yet.\n\nYou said: "${t}"\n\nMode: ${$("modeSelect").value}`),300)
}
function openAuth(mode="login"){
 if(currentUser){if(confirm(`Signed in as ${currentUser.displayName||currentUser.email}. Log out?`))signOut(auth);return}
 authMode=mode;$("authTitle").textContent=mode==="login"?"Welcome back":"Create your account";$("authSubmit").textContent=mode==="login"?"Log in":"Create account";$("switchAuth").textContent=mode==="login"?"Don't have an account? Sign up":"Already have an account? Log in";$("authModal").classList.remove("hidden")
}
function authError(e){return e?.code==="auth/unauthorized-domain"?"Add your GitHub Pages domain to Firebase Authorized domains.":e?.message||"Authentication failed."}

$("sendBtn").onclick=send;$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("newChatBtn").onclick=()=>{activeChatId=null;render()};$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
document.querySelectorAll(".suggest").forEach(b=>b.onclick=()=>{$("messageInput").value=b.dataset.prompt});
$("modeSelect").onchange=updateMode;$("settingsMode").onchange=()=>{$("modeSelect").value=$("settingsMode").value;updateMode()};
$("modeLock").onclick=()=>openAuth("login");$("loginBtn").onclick=()=>openAuth("login");$("topLoginBtn").onclick=()=>openAuth("login");$("signupBtn").onclick=()=>openAuth("signup");
$("authClose").onclick=()=>$("authModal").classList.add("hidden");$("switchAuth").onclick=()=>openAuth(authMode==="login"?"signup":"login");
$("authForm").onsubmit=async e=>{e.preventDefault();try{const em=$("emailInput").value.trim(),pw=$("passwordInput").value;if(authMode==="signup"){const r=await createUserWithEmailAndPassword(auth,em,pw);try{await updateProfile(r.user,{displayName:em.split("@")[0]})}catch{}}else await signInWithEmailAndPassword(auth,em,pw);$("authModal").classList.add("hidden")}catch(err){alert(authError(err))}};
$("googleBtn").onclick=async()=>{try{await signInWithPopup(auth,googleProvider);$("authModal").classList.add("hidden")}catch(err){alert(authError(err))}};
$("settingsBtn").onclick=()=>$("settingsModal").classList.remove("hidden");$("settingsClose").onclick=()=>$("settingsModal").classList.add("hidden");
$("themeToggle").onclick=()=>{document.body.classList.toggle("light");$("themeToggle").textContent=document.body.classList.contains("light")?"Dark mode":"Light mode"};

onAuthStateChanged(auth,user=>{setModeAccess(user);if(user){const n=user.displayName||user.email?.split("@")[0]||"Account";$("loginBtn").textContent=n;$("topLoginBtn").textContent=n;$("signupBtn").style.display="none"}else{$("loginBtn").textContent="Log in";$("topLoginBtn").textContent="Log in";$("signupBtn").style.display=""}});
setModeAccess(null);render();
</script>
